<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f5f2"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self' blob: data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'"><title>PDF Library</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icons/icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="./icons/icon-192.png"><link rel="stylesheet" href="./style.css"><script type="module" src="./app.js"></script></head>
<body><main id="library">
<header class="brand"><div class="brand-name"><img src="./icons/icon.svg" alt="" width="42" height="42"><div><h1>PDF Library</h1><p>読みたい一冊を、すぐそばに。</p></div></div><button id="settings" class="icon-button" aria-label="設定">⚙</button></header>
<div class="search-wrap"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="PDFを検索" aria-label="PDFを検索" autocomplete="off"></div>
<div id="folderbar" class="chips" aria-label="フォルダ"></div>
<section id="favorites-section"><h2>よく使うPDF <span>FAVORITES</span></h2><div id="favorites" class="favorites"></div></section>
<section id="recent-section"><h2>最近開いたPDF <span>RECENT</span></h2><div id="recent" class="recent"></div></section>
<section><div class="section-top"><h2 id="list-title">すべてのPDF</h2><span id="count"></span></div><div id="files" class="file-list"></div><div id="empty" class="empty" hidden><img src="./icons/icon.svg" width="64" height="64" alt=""><h3>PDFだけの、小さな本棚。</h3><p>仕事の資料も、お気に入りの説明書も。<br>「＋ PDFを追加」からはじめよう。</p></div></section>
<button id="add" class="add primary">＋ PDFを追加</button><input id="file-input" type="file" accept="application/pdf,.pdf" multiple hidden><footer>YUU</footer></main>
<section id="viewer" hidden aria-label="PDF閲覧"><div id="viewport" tabindex="0"><div id="pages"></div></div><div id="viewer-toolbar" class="viewer-toolbar"><button id="back" aria-label="ライブラリに戻る">←</button><button id="page-number" aria-label="ページを移動">1 / 1</button><button id="viewer-favorite" aria-label="お気に入り">☆</button><button id="viewer-menu" aria-label="PDFメニュー">⋯</button></div><div id="annotation-tools" hidden><button data-mode="highlight">マーカー</button><button data-mode="pen">ペン</button><button data-mode="note">メモ</button><button id="undo">元に戻す</button><button id="annotate-done">完了</button></div><div id="loading" hidden>PDFを開いています…</div></section>
<dialog id="dialog"><div class="dialog-head"><h2 id="dialog-title"></h2><button id="dialog-close" aria-label="閉じる">×</button></div><div id="dialog-body"></div></dialog><div id="toast" role="status" aria-live="polite" hidden></div>
</body></html>
